<style>
  :root[data-theme="light"] {
    --bg:#fbfbf9; --bg-glow: radial-gradient(ellipse 900px 500px at 50% -8%, rgba(0,0,0,0.035), transparent 60%);
    --card:#ffffff; --border:#eae9e5; --border-light:#f2f1ee;
    --ink:#171717; --muted:#87857f; --faint:#b3b1aa; --very-faint:#dedcd5;
    --accent:#171717; --on-accent:#ffffff;
    --pat-deep:#171717;
    --pat-rem-bg:#171717; --pat-rem-stripe: rgba(255,255,255,.55);
    --pat-light-bg:#c9c7c0; --pat-light-dot: rgba(255,255,255,.75);
    --heat-l1:#e3e1da; --heat-l2:#b3b1aa; --heat-l3:#78766f; --heat-l4:#171717;
    --shadow-xs: 0 1px 1px rgba(23,23,20,0.03);
    --shadow-sm: 0 1px 2px rgba(23,23,20,0.04), 0 1px 1px rgba(23,23,20,0.03);
    --shadow-card: 0 1px 2px rgba(23,23,20,0.03), 0 6px 16px -8px rgba(23,23,20,0.08), 0 16px 32px -20px rgba(23,23,20,0.10);
    --shadow-pressed: inset 0 1px 3px rgba(23,23,20,0.14);
    --shadow-ring: 0 0 0 5px rgba(23,23,20,0.06);
    --shadow: var(--shadow-sm);
  }
  :root[data-theme="dark"] {
    --bg:#0c0c0b; --bg-glow: radial-gradient(ellipse 900px 500px at 50% -8%, rgba(255,255,255,0.035), transparent 60%);
    --card:#1a1a18; --border:#2e2e2b; --border-light:#232320;
    --ink:#f3f2ee; --muted:#9c9a93; --faint:#6f6d67; --very-faint:#3a3a36;
    --accent:#f3f2ee; --on-accent:#0c0c0b;
    --pat-deep:#f3f2ee;
    --pat-rem-bg:#f3f2ee; --pat-rem-stripe: rgba(12,12,11,.55);
    --pat-light-bg:#535250; --pat-light-dot: rgba(12,12,11,.6);
    --heat-l1:#282825; --heat-l2:#4b4a46; --heat-l3:#7c7a73; --heat-l4:#f3f2ee;
    --shadow-xs: 0 1px 1px rgba(0,0,0,0.2);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
    --shadow-card: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 20px -10px rgba(0,0,0,0.5);
    --shadow-pressed: inset 0 1px 3px rgba(0,0,0,0.5);
    --shadow-ring: 0 0 0 5px rgba(243,242,238,0.06);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    background-image: var(--bg-glow);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    transition: background-color 0.25s, color 0.25s;
  }
  #root { max-width: 460px; margin: 0 auto; padding: 0 0 60px; }

  /* header */
  .hero { padding: 34px 20px 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .hero-eyebrow { font-size:12px; color:var(--faint); margin:0 0 7px; text-transform:lowercase; letter-spacing:.02em; }
  .hero-date { font-family:"Fraunces",serif; font-style:italic; font-weight:500; font-size:32px; line-height:1.05; margin:0; letter-spacing:-0.015em; text-transform:capitalize; }
  .hero-right { display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  .theme-switch { flex-shrink:0; width:52px; height:30px; border-radius:999px; background:var(--border-light); border:1px solid var(--border); cursor:pointer; position:relative; padding:0; box-shadow: var(--shadow-pressed); transition: background .2s; }
  .theme-switch .knob { position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--card); box-shadow: var(--shadow-card); transition: transform .3s cubic-bezier(.34,1.4,.64,1); display:flex; align-items:center; justify-content:center; color:var(--ink); }
  :root[data-theme="dark"] .theme-switch .knob { transform: translateX(22px); }
  .week-strip { display:flex; gap:5px; }
  .week-dot { width:8px; height:8px; border-radius:50%; background:var(--border-light); transition: background .2s; }
  .week-dot.done { background:var(--ink); }
  .week-dot.today { border:1.5px solid var(--ink); background:transparent; box-sizing:border-box; width:7px; height:7px; }

  /* tabs */
  .tabs-wrap { padding: 0 20px; margin-bottom: 6px; position: sticky; top:0; background:var(--bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index:10; transition: background .2s; }
  .tabs { display:flex; gap:6px; border-bottom:1px solid var(--border-light); padding: 4px 0 0; }
  .tab-btn { background:none; border:none; font-family:inherit; cursor:pointer; font-size:13.5px; color:var(--faint); padding:8px 14px 12px; position:relative; transition:color .15s; border-radius: 10px 10px 0 0; }
  .tab-btn.active { color:var(--ink); font-weight:600; }
  .tab-underline { position:absolute; bottom:-1px; left:14px; right:14px; height:2.5px; border-radius: 2px 2px 0 0; background:var(--ink); transition: opacity .2s; }
  .tab-underline.hist { transform: translateX(0); }

  section { margin: 0; }
  .section-pad { padding: 28px 20px 10px; }
  .section-pad-row { padding: 28px 20px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .section-label { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; margin:0; }
  .count-line { font-size:12.5px; color:var(--faint); margin: 5px 0 0; }
  .sub-note { font-size:12.5px; color:var(--faint); margin: 4px 0 0; }
  .empty { padding: 30px 20px; text-align:center; font-size:14px; color:var(--faint); }

  .select-mini { font-family:inherit; font-size:12px; color:var(--ink); background:var(--card); border:1px solid var(--border); border-radius:9px; padding:6px 11px; box-shadow: var(--shadow-xs); }

  /* HOY: open habit list */
  .habit-list { padding: 4px 14px 0; }
  .habit-row-open { display:flex; align-items:center; gap:14px; padding: 13px 6px; margin: 0 0 2px; border-radius: 14px; cursor:pointer; transition: background .15s; }
  .habit-row-open:active { background: var(--border-light); }
  .circle-check { flex-shrink:0; width: 27px; height:27px; border-radius:50%; border: 1.5px solid var(--very-faint); background: var(--card); box-shadow: var(--shadow-xs); display:flex; align-items:center; justify-content:center; transition: background .18s, border-color .18s, transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .18s; color: transparent; }
  .circle-check.checked { background: var(--ink); border-color: var(--ink); color: var(--on-accent); transform: scale(1.06); box-shadow: var(--shadow-ring); }
  .habit-name-open { flex:1; font-size:15.5px; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .habit-name-open.done { color:var(--faint); text-decoration: line-through; text-decoration-color: var(--very-faint); }
  .streak-mini { font-size:11px; color:var(--faint); white-space:nowrap; flex-shrink:0; }
  .row-actions { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .icon-btn { background:none; border:none; color:var(--very-faint); cursor:pointer; padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition: background .15s, color .15s; }
  .icon-btn:hover { color:var(--muted); background: var(--border-light); }
  .chevron { transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .add-row-open { padding: 12px 20px 6px; display:flex; align-items:center; gap:12px; }
  .add-row-open input { flex:1; background:transparent; border:none; font-size:15px; color:var(--ink); outline:none; font-family:inherit; padding:6px 0; }
  .add-row-open input::placeholder { color: var(--faint); }
  .add-row-open .plus-circ { flex-shrink:0; width:27px; height:27px; border-radius:50%; border:1.5px dashed var(--very-faint); display:flex; align-items:center; justify-content:center; color:var(--faint); background:var(--card); cursor:pointer; transition: border-color .15s, color .15s, transform .15s; }
  .add-row-open .plus-circ:active { transform: scale(.92); }
  .add-row-open .flex-label { flex:1; font-size:15px; color:var(--faint); padding:6px 0; }
  .flex-habit-panel { padding: 12px 20px 18px; }
  .flex-habit-panel input { width:100%; background:var(--bg); border:1px solid var(--border-light); border-radius:12px; padding:11px 13px; font-size:14px; color:var(--ink); outline:none; font-family:inherit; margin-bottom:12px; box-sizing:border-box; transition: border-color .15s; }
  .flex-habit-panel input:focus { border-color: var(--faint); }
  .day-picker { display:flex; gap:6px; margin-bottom:14px; }
  .day-chip { flex:1; text-align:center; padding:9px 0; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:12px; font-family:inherit; cursor:pointer; transition: all .15s; }
  .day-chip.active { background:var(--ink); color:var(--on-accent); border-color:var(--ink); font-weight:600; box-shadow: var(--shadow-sm); }
  .habit-row-open.inactive-today { opacity:.45; }
  .circle-check.disabled { cursor:default; }
  .flex-days-badge { font-size:10px; color:var(--faint); white-space:nowrap; flex-shrink:0; }

  .cal-panel-open { padding: 4px 0 16px; }

  /* heatmap teaser on Hoy */
  .heat-teaser { padding: 26px 20px 6px; }
  .heat-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .heat-grid { display:flex; gap:3.5px; width:max-content; }
  .heat-col { display:flex; flex-direction:column; gap:3.5px; }
  .heat-cell { width:9px; height:9px; border-radius:3px; background:var(--border-light); }
  .heat-cell.l1 { background:var(--heat-l1); }
  .heat-cell.l2 { background:var(--heat-l2); }
  .heat-cell.l3 { background:var(--heat-l3); }
  .heat-cell.l4 { background:var(--heat-l4); }
  .heat-cell.done { background:var(--ink); }
  .heat-legend { display:flex; align-items:center; gap:5px; margin-top:12px; font-size:10px; color:var(--faint); }
  .heat-legend .heat-cell { width:8px; height:8px; }

  /* quiet cards */
  .card-quiet { background:var(--card); border:1px solid var(--border-light); border-radius:18px; padding: 6px 18px; margin: 0 20px; box-shadow: var(--shadow-card); }
  .card-quiet-pad { padding: 20px; margin: 0 20px; background:var(--card); border:1px solid var(--border-light); border-radius:18px; box-shadow: var(--shadow-card); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border-light); gap:10px; }
  .stat-row:last-child { border-bottom:none; }
  .stat-label { font-size:13px; color:var(--muted); }

  .btn-quiet { width:100%; background:var(--card); border:1px solid var(--border); color:var(--ink); border-radius:13px; padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; text-align:center; font-family:inherit; margin-bottom:8px; box-shadow: var(--shadow-xs); transition: transform .12s; }

  /* CALENDARIO */
  .cal-nav { display:flex; align-items:center; justify-content:space-between; padding: 8px 20px 16px; }
  .cal-month-label { font-size:15px; font-weight:600; text-transform:capitalize; }
  .gcal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; padding:0 20px; }

  .gcal-cell { aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; gap:3px; border:1.5px solid transparent; font-size:13px; color:var(--ink); transition: background .15s, transform .12s; }
  .gcal-cell:active { transform: scale(.93); }

  .gcal-dot-row { display:flex; gap:2px; height:4px; }

  .agenda-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border-light); }

  .recurring-item:last-child { border-bottom:none; }
  .recurring-item-text { font-size:13px; color:var(--ink); }

  /* habit notes */
  .habit-note-panel { padding: 6px 20px 18px; }
  .habit-note-panel textarea { width:100%; background:var(--bg); border:1px solid var(--border-light); border-radius:12px; padding:11px 13px; font-size:13px; color:var(--ink); outline:none; font-family:inherit; resize:vertical; min-height:60px; box-sizing:border-box; transition: border-color .15s; }
  .habit-note-panel textarea:focus { border-color: var(--faint); }

  /* editable agenda / schedule */

  footer { text-align: center; font-size: 11px; color: var(--very-faint); padding: 36px 20px 4px; letter-spacing:.01em; }

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DAY_NAMES = ["dom","lun","mar","mié","jue","vie","sáb"];
const DAY_NAMES_MON = ["lun","mar","mié","jue","vie","sáb","dom"];

function calendarMonthGrid(year, monthIdx) {
  const firstDay = new Date(year, monthIdx, 1);
  const startDow = firstDay.getDay();
  const daysSinceMonday = startDow === 0 ? 6 : startDow - 1;
  const cursor = new Date(year, monthIdx, 1 - daysSinceMonday);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    cells.push({
      dateStr: `${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}-${pad(cursor.getDate())}`,
      day: cursor.getDate(),
      inMonth: cursor.getMonth() === monthIdx,
    });
    cursor.setDate(cursor.getDate() + 1);
  }
  return cells;
}

function pad(n) { return String(n).padStart(2, "0"); }
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function dayLabel(dateStr, todayStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const [ty, tm, td] = todayStr.split("-").map(Number);
  const today = new Date(ty, tm - 1, td);
  const diff = Math.round((today - date) / 86400000);
  if (diff === 0) return "Hoy";
  return DAY_NAMES[date.getDay()];
}
function last7Days(todayStr) {
  const [y, m, d] = todayStr.split("-").map(Number);
  const base = new Date(y, m - 1, d);
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dt = new Date(base);
    dt.setDate(base.getDate() - i);
    days.push(`${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`);
  }
  return days;
}
function monthKeyOf(year, monthIdx) { return `${year}-${pad(monthIdx + 1)}`; }
function parseMonthKey(key) {
  const [y, m] = key.split("-").map(Number);
  return { year: y, monthIdx: m - 1 };
}
function monthLabel(key) {
  const { year, monthIdx } = parseMonthKey(key);
  const name = MONTH_NAMES[monthIdx];
  return name.charAt(0).toUpperCase() + name.slice(1) + " " + year;
}
function monthOptions() {
  const now = new Date();
  const opts = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    opts.push(monthKeyOf(d.getFullYear(), d.getMonth()));
  }
  return opts;
}
function daysInMonth(year, monthIdx) { return new Date(year, monthIdx + 1, 0).getDate(); }

function isDayActive(date, activeDays) {
  // Un array de días vacío (dato corrupto, p.ej. de un backup importado a mano)
  // se trata como "sin restricción" para no dejar prevActiveDate/nextActiveDate en loop infinito.
  return !activeDays || activeDays.length === 0 || activeDays.includes(date.getDay());
}
function prevActiveDate(date, activeDays) {
  const d = new Date(date);
  d.setDate(d.getDate() - 1);
  while (!isDayActive(d, activeDays)) d.setDate(d.getDate() - 1);
  return d;
}
function nextActiveDate(date, activeDays) {
  const d = new Date(date);
  d.setDate(d.getDate() + 1);
  while (!isDayActive(d, activeDays)) d.setDate(d.getDate() + 1);
  return d;
}
function daysLabel(days) {
  if (!days) return null;
  const order = [1, 2, 3, 4, 5, 6, 0];
  const short = { 1: "L", 2: "M", 3: "X", 4: "J", 5: "V", 6: "S", 0: "D" };
  return order.filter((d) => days.includes(d)).map((d) => short[d]).join(" ");
}

function computeStreak(habit, completions, todayStr) {
  const habitId = habit.id;
  const activeDays = habit.days || null;
  const [ty, tm, td] = todayStr.split("-").map(Number);
  let cursor = new Date(ty, tm - 1, td);
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  let count = 0;
  if (isDayActive(cursor, activeDays)) {
    if (!(completions[key(cursor)] || []).includes(habitId)) {
      cursor = prevActiveDate(cursor, activeDays);
    }
  } else {
    cursor = prevActiveDate(cursor, activeDays);
  }
  while ((completions[key(cursor)] || []).includes(habitId)) {
    count++;
    cursor = prevActiveDate(cursor, activeDays);
  }
  return count;
}

function computeBestStreak(habit, completions) {
  const habitId = habit.id;
  const activeDays = habit.days || null;
  const dates = Object.keys(completions).filter((k) => (completions[k] || []).includes(habitId)).sort();
  let best = 0, current = 0, prevDate = null;
  for (const dateStr of dates) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    if (prevDate) {
      const expected = nextActiveDate(prevDate, activeDays);
      const sameDay = expected.getFullYear() === dt.getFullYear() && expected.getMonth() === dt.getMonth() && expected.getDate() === dt.getDate();
      current = sameDay ? current + 1 : 1;
    } else {
      current = 1;
    }
    if (current > best) best = current;
    prevDate = dt;
  }
  return best;
}
function currentWeekDates(todayStr) {
  const [ty, tm, td] = todayStr.split("-").map(Number);
  const today = new Date(ty, tm - 1, td);
  const dow = today.getDay();
  const daysSinceMonday = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - daysSinceMonday);
  const days = [];
  const cursor = new Date(monday);
  while (cursor <= today) {
    days.push(`${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}-${pad(cursor.getDate())}`);
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}
function fullWeekDatesContaining(dateStr) {
  const [ty, tm, td] = dateStr.split("-").map(Number);
  const d = new Date(ty, tm - 1, td);
  const dow = d.getDay();
  const daysSinceMonday = dow === 0 ? 6 : dow - 1;
  const monday = new Date(d);
  monday.setDate(d.getDate() - daysSinceMonday);
  const days = [];
  const cursor = new Date(monday);
  for (let i = 0; i < 7; i++) {
    days.push(`${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}-${pad(cursor.getDate())}`);
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}

function timeToMinutes(t) {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function minutesToTime(mins) {
  if (mins === null) return "—";
  const m = Math.round(mins) % (24 * 60);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return `${pad(h)}:${pad(mm)}`;
}

const DEFAULT_HABITS = [
  { id: "h1", name: "Beber 2L de agua" },
  { id: "h2", name: "Leer 20 minutos" },
  { id: "h3", name: "Estirar / mover el cuerpo" },
];

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// Genera IDs únicos con crypto.randomUUID() (con fallback por si el navegador no lo soporta)
function uid(prefix) {
  const raw = (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function")
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
  return prefix ? `${prefix}${raw}` : raw;
}

function CheckIcon() {
  return <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
}
function XIcon() {
  return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
}
function PlusIcon() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
}
function ChevronIcon({ open, cls }) {
  return (
    <svg className={`${cls || "chevron"} ${open ? "open" : ""}`} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  );
}
function PauseIcon() {
  return <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
}
function PlayIcon() {
  return <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
}
function EditIcon() {
  return <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>;
}
function NoteIcon() {
  return <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16v14l-4 4H4z"></path><path d="M8 10h8M8 14h5"></path></svg>;

function MiniCalendar({ habitId, monthKey, completions }) {
  const { year, monthIdx } = parseMonthKey(monthKey);
  const total = daysInMonth(year, monthIdx);
  const cells = [];
  for (let day = 1; day <= total; day++) {
    const dateKey = `${year}-${pad(monthIdx + 1)}-${pad(day)}`;
    const done = (completions[dateKey] || []).includes(habitId);
    cells.push(<div className={`cal-cell ${done ? "done" : ""}`} key={day}>{day}</div>);
  }
  return <div className="cal-grid">{cells}</div>;
}

function yearGridWeeks(todayStr, weeksBack) {
  const [ty, tm, td] = todayStr.split("-").map(Number);
  const today = new Date(ty, tm - 1, td);
  const dow = today.getDay();
  const daysSinceMonday = dow === 0 ? 6 : dow - 1;
  const thisMonday = new Date(today);
  thisMonday.setDate(today.getDate() - daysSinceMonday);
  const startMonday = new Date(thisMonday);
  startMonday.setDate(thisMonday.getDate() - weeksBack * 7);
  const weeks = [];
  const cursor = new Date(startMonday);
  for (let w = 0; w <= weeksBack; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const dateStr = `${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}-${pad(cursor.getDate())}`;
      const isFuture = cursor > today;
      week.push({ dateStr, isFuture });
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(week);
  }
  return weeks;
}

function YearHeatmap({ habitId, completions, todayStr }) {
  const weeks = useMemo(() => yearGridWeeks(todayStr, 52), [todayStr]);
  return (
    <div className="heat-scroll">
      <div className="heat-grid">
        {weeks.map((week, wi) => (
          <div className="heat-col" key={wi}>
            {week.map((day, di) => {
              if (day.isFuture) return <div className="heat-cell" style={{ background: "transparent" }} key={di}></div>;
              const done = (completions[day.dateStr] || []).includes(habitId);
              return <div className={`heat-cell ${done ? "done" : ""}`} key={di} title={day.dateStr}></div>;
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// Aggregate heatmap: intensity = fraction of habits completed that day (4 levels)
function ConsistencyHeatmap({ completions, habitCount, todayStr, weeksBack }) {
  const weeks = useMemo(() => yearGridWeeks(todayStr, weeksBack), [todayStr, weeksBack]);
  const levelFor = (dateStr, isFuture) => {
    if (isFuture || habitCount === 0) return "";
    const n = (completions[dateStr] || []).length;
    const pct = n / habitCount;
    if (pct <= 0) return "";
    if (pct < 0.34) return "l1";
    if (pct < 0.67) return "l2";
    if (pct < 1) return "l3";
    return "l4";
  };
  return (
    <div className="heat-scroll">
      <div className="heat-grid">
        {weeks.map((week, wi) => (
          <div className="heat-col" key={wi}>
            {week.map((day, di) => {
              if (day.isFuture) return <div className="heat-cell" style={{ background: "transparent" }} key={di}></div>;
              const lvl = levelFor(day.dateStr, day.isFuture);
              return <div className={`heat-cell ${lvl}`} key={di} title={day.dateStr}></div>;
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

const HOUR_HEIGHT = 56;
function hourLabel(h) {
  if (h === 0) return "12 AM";
  if (h === 12) return "12 PM";
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}
function layoutScheduleBlocks(items) {
  const withMinutes = items.map((it) => {
    const startMin = timeToMinutes(it.start) ?? 0;
    let endMin = it.end ? timeToMinutes(it.end) : null;
    if (endMin === null || endMin <= startMin) endMin = startMin + 30;
    return { ...it, startMin, endMin };
  }).sort((a, b) => a.startMin - b.startMin || a.endMin - b.endMin);

  const clusters = [];
  let current = [], currentEnd = -1;
  withMinutes.forEach((e) => {
    if (current.length === 0 || e.startMin < currentEnd) {
      current.push(e);
      currentEnd = Math.max(currentEnd, e.endMin);
    } else {
      clusters.push(current);
      current = [e];
      currentEnd = e.endMin;
    }
  });
  if (current.length) clusters.push(current);

  const positioned = [];
  clusters.forEach((cluster) => {
    const colEnds = [];
    cluster.forEach((e) => {
      let col = colEnds.findIndex((end) => e.startMin >= end);
      if (col === -1) { col = colEnds.length; colEnds.push(e.endMin); }
      else colEnds[col] = e.endMin;
      positioned.push({ ...e, col });
    });
    const totalCols = colEnds.length;
    for (let i = positioned.length - cluster.length; i < positioned.length; i++) positioned[i].totalCols = totalCols;
  });
  return positioned;
}

      setRecurringSchedules([...recurringSchedules, { id: uid("r"), days: [...schRecurDays].sort((a, b) => a - b), start: schStart, end: schEnd, text }]);
    } else {
      const list = daySchedules[calSelected] || [];
      setDaySchedules({ ...daySchedules, [calSelected]: [...list, { id: uid("s"), start: schStart, end: schEnd, text }] });
    }
    resetScheduleForm();
  };
  const startEditSchedule = (block) => {
    setEditingScheduleId(block.id);
    setSchStart(block.start || ""); setSchEnd(block.end || ""); setSchText(block.text || "");
    if (block.recurring) {
      const rule = recurringSchedules.find((r) => r.id === block.ruleId);
      setSchRecurring(true);
      setSchRecurDays(rule ? rule.days : []);
    } else {
      setSchRecurring(false); setSchRecurDays([]);
    }
  };
  const removeSchedule = (dateStr, block) => {
    if (block.recurring) {
      if (!window.confirm("Este bloque se repite cada semana. ¿Eliminar la serie completa?")) return;
      setRecurringSchedules(recurringSchedules.filter((r) => r.id !== block.ruleId));
      if (editingScheduleId === block.id) resetScheduleForm();
      return;
    }
    const list = (daySchedules[dateStr] || []).filter((s) => s.id !== block.id);
    const copy = { ...daySchedules };
    if (list.length) copy[dateStr] = list; else delete copy[dateStr];
    setDaySchedules(copy);
    if (editingScheduleId === block.id) resetScheduleForm();
  };
  const duplicateSchedule = () => {
    if (!dupDate || scheduleList.length === 0 || dupDate === calSelected) return;
    const existing = daySchedules[dupDate] || [];
    if (existing.length > 0 && !window.confirm("Ese día ya tiene un horario. ¿Reemplazarlo?")) return;
    const copy = scheduleList.map((it) => ({ id: uid("s"), start: it.start, end: it.end, text: it.text }));
    setDaySchedules({ ...daySchedules, [dupDate]: copy });
    setDupDate("");
    setDupMsg("Horario duplicado ✓");
    setTimeout(() => setDupMsg(""), 2200);
  };

  const heroDateStr = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  const hour = new Date().getHours();
  const greeting = hour < 12 ? "buenos días" : hour < 20 ? "buenas tardes" : "buenas noches";

  return (
    <div id="root">
      <div className="hero">
        <div>
          <p className="hero-eyebrow">{greeting}</p>
          <h1 className="hero-date">{heroDateStr}</h1>
        </div>
        <div className="hero-right">
          <button className="theme-switch" onClick={() => setTheme(theme === "light" ? "dark" : "light")} aria-label="Cambiar tema">
            <span className="knob">{theme === "light" ? <SunIcon /> : <MoonIcon />}</span>
          </button>
          <div className="week-strip" title="Esta semana">
            {weekStrip.map((w) => (
              <div key={w.d} className={`week-dot ${w.done ? "done" : ""} ${w.isToday ? "today" : ""}`}
                   style={w.some && !w.done ? { background: "var(--faint)" } : undefined}></div>
            ))}
          </div>
        </div>
      </div>

      <div className="tabs-wrap">
        <div className="tabs">
          <button className={`tab-btn ${tab === "hoy" ? "active" : ""}`} onClick={() => setTab("hoy")}>
            Hoy
            {tab === "hoy" && <span className="tab-underline"></span>}
          </button>
          <button className={`tab-btn ${tab === "historial" ? "active" : ""}`} onClick={() => setTab("historial")}>
            Historial
            {tab === "historial" && <span className="tab-underline"></span>}
          </button>
          <button className={`tab-btn ${tab === "calendario" ? "active" : ""}`} onClick={() => setTab("calendario")}>
            Calendario
            {tab === "calendario" && <span className="tab-underline"></span>}
          </button>
        </div>
      </div>

      {tab === "hoy" && (
        <React.Fragment>
          <div className="section-pad">
            <p className="section-label">Hoy</p>
            <p className="count-line">{todayCompletions.length}/{activeHabits.length} completados{weekSummary.avgSleep !== null ? ` · sueño promedio ${weekSummary.avgSleep.toFixed(1)} h esta semana` : ""}</p>
          </div>

          <div className="habit-list">
            {habits.length === 0 && <div className="empty">Aún no tienes hábitos. Añade el primero abajo.</div>}
            {habits.map((habit) => {
              const checked = todayCompletions.includes(habit.id);
              const isOpen = !!expanded[habit.id];
              const streak = computeStreak(habit, completions, today);
              const best = computeBestStreak(habit, completions);
              const activeToday = (!habit.days || habit.days.includes(todayDow)) && !habit.paused;
              const hasNote = !!(habitNotes[`${today}::${habit.id}`] || "").trim();
              let badgeText = null;
              if (streak > 0 && best > streak) badgeText = `${streak} d · récord ${best}`;
              else if (streak > 0) badgeText = `${streak} ${streak === 1 ? "día" : "días"}`;
              else if (best > 0) badgeText = `récord ${best} d`;
              const handleToggle = () => { if (activeToday) toggleHabit(habit.id); };
              return (
                <React.Fragment key={habit.id}>
                  <div
                    className={`habit-row-open ${!activeToday ? "inactive-today" : ""} ${habit.paused ? "paused" : ""}`}
                    onMouseDown={() => handlePressStart(habit)}
                    onMouseUp={handlePressEnd}
                    onMouseLeave={handlePressEnd}
                    onTouchStart={() => handlePressStart(habit)}
                    onTouchEnd={handlePressEnd}
                  >
                    <div className={`circle-check ${checked ? "checked" : ""} ${!activeToday ? "disabled" : ""}`} onClick={handleToggle}>
                      {checked && <CheckIcon />}
                    </div>
                    <span className={`habit-name-open ${checked ? "done" : ""}`} onClick={handleToggle}>{habit.name}</span>
                    {habit.paused && <span className="pause-badge">Pausado</span>}
                    {habit.days && <span className="flex-days-badge">{daysLabel(habit.days)}</span>}
                    {badgeText && <span className="streak-mini">{badgeText}</span>}
                    <div className="row-actions">
                      <button className="icon-btn" onClick={() => openNote(habit)} aria-label="Nota del día" style={hasNote ? { color: "var(--ink)" } : undefined}>
                        <NoteIcon />
                      </button>
                      <button className="icon-btn" onClick={() => togglePause(habit.id)} aria-label={habit.paused ? "Reanudar hábito" : "Pausar hábito"}>
                        {habit.paused ? <PlayIcon /> : <PauseIcon />}
                      </button>
                      <button className="icon-btn" onClick={() => toggleExpand(habit.id)} aria-label="Ver calendario del mes">
                        <ChevronIcon open={isOpen} />
                      </button>
                      <button className="icon-btn" onClick={() => removeHabit(habit.id)} aria-label={`Eliminar ${habit.name}`}>
                        <XIcon />
                      </button>
                    </div>
                  </div>
                  {noteOpenId === habit.id && (
                    <div className="habit-note-panel">
                      <textarea
                        value={noteDraft}
                        onChange={(e) => setNoteDraft(e.target.value)}
                        placeholder="Nota de hoy para este hábito (opcional)"
                        autoFocus
                      />
                      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                        <button className="save-btn" onClick={() => saveNote(habit.id)}>Guardar nota</button>
                        <button className="btn-quiet" style={{ width: "auto", margin: 0, padding: "10px 16px" }} onClick={() => setNoteOpenId(null)}>Cancelar</button>
                      </div>
                    </div>
                  )}
                  {isOpen && (
                    <div className="cal-panel-open">
                      <MiniCalendar habitId={habit.id} monthKey={currentMonthKey} completions={completions} />
                    </div>
                  )}
                  {editingDaysId === habit.id && (
                    <div className="flex-habit-panel">
                      <div className="day-picker">
                        {DAY_NAMES_MON.map((label, i) => {
                          const dayNum = i === 6 ? 0 : i + 1;
                          const active = editDaysValue.includes(dayNum);
                          return (
                            <button
                              key={dayNum}
                              type="button"
                              className={`day-chip ${active ? "active" : ""}`}
                              onClick={() => setEditDaysValue((prev) => (prev.includes(dayNum) ? prev.filter((x) => x !== dayNum) : [...prev, dayNum]))}
                            >
                              {label}
                            </button>
                          );
                        })}
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button className="save-btn" onClick={() => saveEditDays(habit.id)} disabled={editDaysValue.length === 0}>Guardar días</button>
                        <button className="btn-quiet" style={{ width: "auto", margin: 0, padding: "10px 16px" }} onClick={() => setEditingDaysId(null)}>Cancelar</button>
                      </div>
                    </div>
                  )}
                </React.Fragment>
              );
            })}
          </div>
          <div className="add-row-open">
            <button className="plus-circ" onClick={addHabit} aria-label="Añadir hábito"><PlusIcon /></button>
            <input
              value={newHabit}
              onChange={(e) => setNewHabit(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addHabit()}
              placeholder="Añadir un hábito nuevo"
            />
          </div>

          <div className="add-row-open" onClick={() => setFlexOpen((v) => !v)} style={{ cursor: "pointer" }}>
            <button
              className="plus-circ"
              aria-label="Añadir hábito flexible"
              onClick={(e) => { e.stopPropagation(); setFlexOpen((v) => !v); }}
            >
              <PlusIcon />
            </button>
            <span className="flex-label">Añadir un hábito flexible nuevo</span>
            <ChevronIcon open={flexOpen} />
          </div>
          {flexOpen && (
            <div className="flex-habit-panel">
              <input
                value={flexName}
                onChange={(e) => setFlexName(e.target.value)}
                placeholder="Nombre del hábito"
              />
              <div className="day-picker">
                {DAY_NAMES_MON.map((label, i) => {
                  const dayNum = i === 6 ? 0 : i + 1;
                  const active = flexDays.includes(dayNum);
                  return (
                    <button
                      key={dayNum}
                      type="button"
                      className={`day-chip ${active ? "active" : ""}`}
                      onClick={() => setFlexDays((prev) => (prev.includes(dayNum) ? prev.filter((x) => x !== dayNum) : [...prev, dayNum]))}
                    >
                      {label}
                    </button>
                  );
                })}
              </div>
              <button className="save-btn" onClick={confirmAddFlexHabit} disabled={!flexName.trim() || flexDays.length === 0}>Añadir hábito flexible</button>
            </div>
          )}

          {habits.length > 0 && (
            <div className="heat-teaser">
              <p className="section-label" style={{ marginBottom: 12 }}>Constancia — 12 semanas</p>
              <ConsistencyHeatmap completions={completions} habitCount={activeHabits.length} todayStr={today} weeksBack={11} />
              <div className="heat-legend">
                <span>menos</span>
                <span className="heat-cell l1"></span><span className="heat-cell l2"></span><span className="heat-cell l3"></span><span className="heat-cell l4"></span>
                <span>más</span>
              </div>
            </div>
          )}

          <div className="section-pad">
            <p className="section-label">🌙 Sueño</p>
          </div>
          <div className="card-quiet-pad">
            <div className="field-row-mini">
              <div className="field-mini"><label>Total (h)</label><input type="number" step="0.25" min="0" max="24" value={sleepTotal} onChange={(e) => setSleepTotal(e.target.value)} placeholder="7.5" /></div>
              <div className="field-mini"><label>Profundo (h)</label><input type="number" step="0.25" min="0" max="24" value={sleepDeep} onChange={(e) => setSleepDeep(e.target.value)} placeholder="opcional" /></div>
              <div className="field-mini"><label>REM (h)</label><input type="number" step="0.25" min="0" max="24" value={sleepRem} onChange={(e) => setSleepRem(e.target.value)} placeholder="opcional" /></div>
              <div className="field-mini"><label>Ligero (h)</label><input type="number" step="0.25" min="0" max="24" value={sleepLight} onChange={(e) => setSleepLight(e.target.value)} placeholder="opcional" /></div>
            </div>
            <div className="field-row-2">
              <div className="field-mini"><label>Te acuestas</label><input type="time" value={sleepBedtime} onChange={(e) => setSleepBedtime(e.target.value)} /></div>
              <div className="field-mini"><label>Te despiertas</label><input type="time" value={sleepWake} onChange={(e) => setSleepWake(e.target.value)} /></div>
            </div>
            <div className="save-row">
              <button className="save-btn" onClick={saveSleep}>Guardar registro de hoy</button>
              {saveMsg && <span className="save-msg">{saveMsg}</span>}
            </div>
            {sleepWarning && <p className="save-warn">{sleepWarning}</p>}
          </div>

          <div className="section-pad"></div>
          <div className="card-quiet-pad" style={{ marginTop: -16 }}>
            <p className="chart-title">Últimos 7 días</p>
            <div className="chart-wrap">
              <div className="chart">
                {chartData.map((d, i) => {
                  const totalH = d.deep + d.rem + d.light + d.other;
                  const heightPct = totalH === 0 ? 0 : (totalH / maxVal) * 100;
                  const deepPct = totalH === 0 ? 0 : (d.deep / totalH) * 100;
                  const remPct = totalH === 0 ? 0 : (d.rem / totalH) * 100;
                  const lightPct = totalH === 0 ? 0 : (d.light / totalH) * 100;
                  const otherPct = totalH === 0 ? 0 : (d.other / totalH) * 100;
                  return (
                    <div className="bar-col" key={i}>
                      <span className="bar-total">{totalH > 0 ? totalH.toFixed(1) : ""}</span>
                      <div className="bar-stack" style={{ height: `${heightPct}%` }}>
                        <div className="bar-deep" style={{ height: `${deepPct}%` }}></div>
                        <div className="bar-rem" style={{ height: `${remPct}%` }}></div>
                        <div className="bar-light" style={{ height: `${lightPct}%` }}></div>
                        <div className="bar-other" style={{ height: `${otherPct}%` }}></div>
                      </div>
                      <span className="bar-label">{d.day}</span>
                    </div>
                  );
                })}
              </div>
              <div className="legend">
                <div className="legend-item"><span className="swatch sw-deep"></span>Profundo</div>
                <div className="legend-item"><span className="swatch sw-rem"></span>REM</div>
                <div className="legend-item"><span className="swatch sw-light"></span>Ligero</div>
              </div>
            </div>
          </div>
        </React.Fragment>
      )}

      {tab === "historial" && (
        <React.Fragment>
          <div className="section-pad">
            <p className="section-label">Hábitos por mes</p>
          </div>
          {habits.length === 0 && <div className="empty">Aún no tienes hábitos.</div>}
          {habits.map((habit) => {
            const mKey = habitMonths[habit.id] || currentMonthKey;
            const isHeatOpen = !!heatmapOpen[habit.id];
            return (
              <div className="habit-block" key={habit.id}>
                <div className="habit-block-head">
                  <span className="habit-block-name">{habit.name}</span>
                  <select
                    className="select-mini"
                    value={mKey}
                    onChange={(e) => setHabitMonths({ ...habitMonths, [habit.id]: e.target.value })}
                  >
                    {monthOptions().map((mk) => (
                      <option value={mk} key={mk}>{monthLabel(mk)}</option>
                    ))}
                  </select>
                </div>
                <MiniCalendar habitId={habit.id} monthKey={mKey} completions={completions} />
                <div className="heat-toggle-row" onClick={() => toggleHeatmap(habit.id)}>
                  <p>Últimos 12 meses</p>
                  <ChevronIcon open={isHeatOpen} cls="chev" />
                </div>
                {isHeatOpen && (
                  <YearHeatmap habitId={habit.id} completions={completions} todayStr={today} />
                )}
              </div>
            );
          })}

          <div className="section-pad-row">
            <p className="section-label">🌙 Sueño — promedios</p>
            <select className="select-mini" value={statsMonth} onChange={(e) => setStatsMonth(e.target.value)}>
              {monthOptions().map((mk) => (
                <option value={mk} key={mk}>{monthLabel(mk)}</option>
              ))}
            </select>
          </div>
          <div className="card-quiet">
            <div className="stat-row"><span className="stat-label">Sueño total promedio</span><span className="stat-value">{fmtAvg(monthStats.total)}</span></div>
            <div className="stat-row"><span className="stat-label">Sueño profundo promedio</span><span className="stat-value">{fmtAvg(monthStats.deep)}</span></div>
            <div className="stat-row"><span className="stat-label">Sueño REM promedio</span><span className="stat-value">{fmtAvg(monthStats.rem)}</span></div>
            <div className="stat-row"><span className="stat-label">Sueño ligero promedio</span><span className="stat-value">{fmtAvg(monthStats.light)}</span></div>
            <div className="stat-row"><span className="stat-label">Hora media de acostarte</span><span className="stat-value">{monthStats.bedtime === null ? "—" : minutesToTime(monthStats.bedtime)}</span></div>
            <div className="stat-row"><span className="stat-label">Consistencia de la hora de dormir</span><span className="stat-value muted-val">{bedtimeConsistency === null ? "—" : `± ${bedtimeConsistency} min`}</span></div>
            <div className="stat-row"><span className="stat-label">Hora media de despertar</span><span className="stat-value">{monthStats.wake === null ? "—" : minutesToTime(monthStats.wake)}</span></div>
            <div className="stat-row"><span className="stat-label">Consistencia del horario</span><span className="stat-value muted-val">{wakeConsistency === null ? "—" : `± ${wakeConsistency} min`}</span></div>
          </div>

          <div className="section-pad"></div>
          <div className="card-quiet-pad" style={{ marginTop: -16 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <span className="section-label">Consultar un día</span>
              <input className="date-input-mini" type="date" value={lookupDate} onChange={(e) => setLookupDate(e.target.value)} />
            </div>
            {lookupEntry ? (
              <React.Fragment>
                <div className="stat-row"><span className="stat-label">Total</span><span className="stat-value">{typeof lookupEntry.total === "number" ? `${lookupEntry.total} h` : "—"}</span></div>
                <div className="stat-row"><span className="stat-label">Profundo</span><span className="stat-value">{typeof lookupEntry.deep === "number" ? `${lookupEntry.deep} h` : "—"}</span></div>
                <div className="stat-row"><span className="stat-label">REM</span><span className="stat-value">{typeof lookupEntry.rem === "number" ? `${lookupEntry.rem} h` : "—"}</span></div>
                <div className="stat-row"><span className="stat-label">Ligero</span><span className="stat-value">{typeof lookupEntry.light === "number" ? `${lookupEntry.light} h` : "—"}</span></div>
                <div className="stat-row"><span className="stat-label">Hora de acostarte</span><span className="stat-value">{lookupEntry.bedtime || "—"}</span></div>
                <div className="stat-row"><span className="stat-label">Hora de despertar</span><span className="stat-value">{lookupEntry.wake || "—"}</span></div>
              </React.Fragment>
            ) : (
              <div className="empty">Sin registro de sueño para esta fecha.</div>
            )}
          </div>

          <div className="section-pad">
            <p className="section-label">Sueño y hábitos</p>
          </div>
          <div className="card-quiet-pad">
            <div className="field-row-mini" style={{ marginBottom: 16 }}>
              <div className="field-mini">
                <label>Umbral "muchas horas" (≥)</label>
                <input
                  type="number" step="0.5" min="0" max="24"
                  value={sleepThresholds.high}
                  onChange={(e) => setSleepThresholds({ ...sleepThresholds, high: parseFloat(e.target.value) || 0 })}
                />
              </div>
              <div className="field-mini">
                <label>Umbral "pocas horas" (&lt;)</label>
                <input
                  type="number" step="0.5" min="0" max="24"
                  value={sleepThresholds.low}
                  onChange={(e) => setSleepThresholds({ ...sleepThresholds, low: parseFloat(e.target.value) || 0 })}
                />
              </div>
            </div>
            <div className="corr-bar-row">
              <div className="corr-bar-label">
                <span>Con {sleepThresholds.high}+ horas de sueño{sleepHabitCorrelation.highN > 0 ? ` (${sleepHabitCorrelation.highN}d)` : ""}</span>
                <span>{sleepHabitCorrelation.high === null ? "—" : `${Math.round(sleepHabitCorrelation.high)}%`}</span>
              </div>
              <div className="corr-bar-track"><div className="corr-bar-fill" style={{ width: `${sleepHabitCorrelation.high || 0}%` }}></div></div>
            </div>
            <div className="corr-bar-row">
              <div className="corr-bar-label">
                <span>Con menos de {sleepThresholds.low} horas{sleepHabitCorrelation.lowN > 0 ? ` (${sleepHabitCorrelation.lowN}d)` : ""}</span>
                <span>{sleepHabitCorrelation.low === null ? "—" : `${Math.round(sleepHabitCorrelation.low)}%`}</span>
              </div>
              <div className="corr-bar-track"><div className="corr-bar-fill striped" style={{ width: `${sleepHabitCorrelation.low || 0}%` }}></div></div>
            </div>
            {(sleepHabitCorrelation.high === null || sleepHabitCorrelation.low === null) && (
              <p className="sub-note" style={{ marginTop: 10 }}>Necesitas más días con datos de sueño y hábitos para ver la comparación.</p>
            )}
          </div>

          <div className="section-pad">
            <p className="section-label">Copia de seguridad</p>
          </div>
          <div className="card-quiet-pad">
            <button className="btn-quiet" onClick={exportData}>Exportar copia de seguridad</button>
            <button className="btn-quiet" onClick={triggerImport}>Importar copia</button>
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleImportFile} />
            {importMsg && <p className="sub-note">{importMsg}</p>}
            <p className="sub-note" style={{ marginTop: 10 }}>Tus datos ya se guardan en este dispositivo automáticamente. Exporta una copia de vez en cuando por si cambias de teléfono o borras datos de Safari.</p>
          </div>
        </React.Fragment>
      )}

      {tab === "calendario" && (
        <React.Fragment>
          <div className="cal-nav">
            <button className="icon-btn" onClick={() => goToMonth(-1)} aria-label="Mes anterior">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span className="cal-month-label">{monthLabel(monthKeyOf(calMonth.year, calMonth.monthIdx))}</span>
            <button className="icon-btn" onClick={() => goToMonth(1)} aria-label="Mes siguiente">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>

          <div className="gcal-grid">
            {DAY_NAMES_MON.map((d) => <div className="gcal-dow" key={d}>{d}</div>)}
            {calWeeks.map((cell) => {
              const isToday = cell.dateStr === today;
              const isSelected = cell.dateStr === calSelected;
              const count = (calendarEvents[cell.dateStr] || []).length;
              return (
                <div
                  key={cell.dateStr}
                  className={`gcal-cell ${cell.inMonth ? "" : "other-month"} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}`}
                  onClick={() => setCalSelected(cell.dateStr)}
                >
                  <span>{cell.day}</span>
                  <div className="gcal-dot-row">
                    {Array.from({ length: Math.min(count, 3) }).map((_, i) => <span className="gcal-dot" key={i}></span>)}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="section-pad">
            <p className="section-label">{new Date(calSelected + "T00:00:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" })}</p>
          </div>
          <div className="card-quiet-pad">
            {(calendarEvents[calSelected] || []).length === 0 && (
              <p className="sub-note" style={{ margin: "0 0 6px" }}>Sin anotaciones para este día.</p>
            )}
            {(calendarEvents[calSelected] || []).map((ev) => (
              <div className="agenda-item" key={ev.id}>
                {editingEventId === ev.id ? (
                  <input
                    className="agenda-edit-input"
                    value={editingEventText}
                    autoFocus
                    onChange={(e) => setEditingEventText(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && saveEditEvent(calSelected, ev.id)}
                    onBlur={() => saveEditEvent(calSelected, ev.id)}
                  />
                ) : (
                  <span className="agenda-text" onClick={() => startEditEvent(ev)} style={{ cursor: "pointer" }}>{ev.text}</span>
                )}
                <button className="icon-btn" onClick={() => startEditEvent(ev)} aria-label="Editar nota"><EditIcon /></button>
                <button className="icon-btn" onClick={() => removeCalEvent(calSelected, ev.id)} aria-label="Eliminar nota"><XIcon /></button>
              </div>
            ))}
            <div className="add-row-open" style={{ padding: "12px 0 0" }}>
              <button className="plus-circ" onClick={addCalEvent} aria-label="Añadir nota"><PlusIcon /></button>
              <input
                value={calNewText}
                onChange={(e) => setCalNewText(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addCalEvent()}
                placeholder="Añadir nota para este día (opcional)"
              />
            </div>
          </div>

          <div className="section-pad">
            <p className="section-label">Horario del día</p>
          </div>
          <div className="card-quiet-pad">
            {scheduleList.length === 0 && (
              <p className="sub-note" style={{ margin: "0 0 10px" }}>Aún no has planificado este día.</p>
            )}
            <div className="sched-timeline-wrap" ref={timelineRef}>
              <div className="sched-timeline" style={{ height: 24 * HOUR_HEIGHT }}>
                <div className="sched-hours">
                  {Array.from({ length: 24 }).map((_, h) => (
                    <span className="sched-hour-label" style={{ top: h * HOUR_HEIGHT }} key={h}>{hourLabel(h)}</span>
                  ))}
                </div>
                <div className="sched-lane">
                  {Array.from({ length: 24 }).map((_, h) => (
                    <div className="sched-hline" style={{ top: h * HOUR_HEIGHT }} key={h}></div>
                  ))}
                  {calSelected === today && (
                    <div className="sched-now-line" style={{ top: (nowMinutes / 60) * HOUR_HEIGHT }}>
                      <span className="sched-now-dot"></span>
                    </div>
                  )}
                  {positionedSchedule.map((b, i) => {
                    const top = (b.startMin / 60) * HOUR_HEIGHT;
                    const height = Math.max(((b.endMin - b.startMin) / 60) * HOUR_HEIGHT, 20);
                    const widthPct = 100 / b.totalCols;
                    return (
                      <div
                        key={b.id}
                        className={`sched-block pat-${(i % 5) + 1} ${b.recurring ? "rec-badge" : ""}`}
                        style={{ top, height, left: `calc(${b.col * widthPct}% + 2px)`, width: `calc(${widthPct}% - 4px)` }}
                        onClick={() => startEditSchedule(b)}
                      >
                        <span className="sched-block-time">{b.start || "—"}{b.end ? ` – ${b.end}` : ""}</span>
                        <span className="sched-block-text">{b.text}</span>
                        <button className="sched-block-del" onClick={(e) => { e.stopPropagation(); removeSchedule(calSelected, b); }} aria-label="Eliminar bloque"><XIcon /></button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
            <div className="sched-add-row" style={{ marginTop: 14 }}>
              <div className="field-mini"><label>Inicio</label><input type="time" value={schStart} onChange={(e) => setSchStart(e.target.value)} /></div>
              <div className="field-mini"><label>Fin</label><input type="time" value={schEnd} onChange={(e) => setSchEnd(e.target.value)} /></div>
            </div>
            <div className="add-row-open" style={{ padding: "10px 0 0" }}>
              <button className="plus-circ" onClick={addSchedule} aria-label={editingScheduleId ? "Guardar cambios" : "Añadir bloque"}>
                {editingScheduleId ? <CheckIcon /> : <PlusIcon />}
              </button>
              <input
                value={schText}
                onChange={(e) => setSchText(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addSchedule()}
                placeholder="Actividad (ej. Reunión, gimnasio...)"
              />
            </div>
            <div className="sched-recur-row" onClick={() => setSchRecurring((v) => !v)}>
              <input type="checkbox" checked={schRecurring} onChange={() => setSchRecurring((v) => !v)} onClick={(e) => e.stopPropagation()} />
              <span>Repetir cada semana</span>
            </div>
            {schRecurring && (
              <div className="day-picker" style={{ marginTop: 10 }}>
                {DAY_NAMES_MON.map((label, i) => {
                  const dayNum = i === 6 ? 0 : i + 1;
                  const active = schRecurDays.includes(dayNum);
                  return (
                    <button
                      key={dayNum}
                      type="button"
                      className={`day-chip ${active ? "active" : ""}`}
                      onClick={() => setSchRecurDays((prev) => (prev.includes(dayNum) ? prev.filter((x) => x !== dayNum) : [...prev, dayNum]))}
                    >
                      {label}
                    </button>
                  );
                })}
              </div>
            )}
            {editingScheduleId && (
              <button className="btn-quiet" style={{ marginTop: 10 }} onClick={resetScheduleForm}>Cancelar edición</button>
            )}
            {recurringSchedules.length > 0 && (
              <div className="recurring-list">
                <p className="sub-note" style={{ margin: "0 0 4px" }}>Bloques recurrentes</p>
                {recurringSchedules.map((r) => (
                  <div className="recurring-item" key={r.id}>
                    <div>
                      <div className="recurring-item-text">{r.text} · {r.start || "—"}{r.end ? ` – ${r.end}` : ""}</div>
                      <div className="recurring-item-days">{daysLabel(r.days)}</div>
                    </div>
                    <button className="icon-btn" onClick={() => setRecurringSchedules(recurringSchedules.filter((x) => x.id !== r.id))} aria-label="Eliminar serie"><XIcon /></button>
                  </div>
                ))}
              </div>
            )}
            {scheduleList.length > 0 && (
              <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid var(--border-light)" }}>
                <p className="sub-note" style={{ margin: "0 0 8px" }}>Duplicar este horario a otro día</p>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <input className="date-input-mini" type="date" value={dupDate} onChange={(e) => setDupDate(e.target.value)} />
                  <button
                    className="btn-quiet"
                    style={{ width: "auto", margin: 0, padding: "8px 14px" }}
                    onClick={duplicateSchedule}
                    disabled={!dupDate}
                  >
                    Duplicar
                  </button>
                </div>
                {dupMsg && <p className="save-msg" style={{ marginTop: 8 }}>{dupMsg}</p>}
              </div>
            )}
          </div>
        </React.Fragment>
      )}

      <footer>Los hábitos se reinician automáticamente cada día</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  function showHabitosBanner(text) {
    var el = document.createElement("div");
    el.textContent = text;
    el.style.cssText = "position:fixed;left:12px;right:12px;bottom:16px;z-index:99999;background:#171717;color:#fff;padding:13px 18px;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);";
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 6000);
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", function (event) {
      if (event.data && event.data.type === "HABITOS_CACHE_READY") {
        showHabitosBanner("✓ Copia offline guardada — ya puedes usar la app sin internet");
      }
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {
        // Si falla el registro (ej. abierto como archivo local sin servidor),
        // la app sigue funcionando normal, solo sin modo offline.
      });
    });
  }
</script>
</body>
</html>
